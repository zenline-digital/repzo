<html lang="en" dir="ltr">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--bg:#0b0b0c;--card:#141417;--card2:#1b1b20;--line:#2a2a30;--text:#f4f4f5;--muted:#9a9aa3;--red:#e5322d;--red2:#ff8a80;--green:#3ddc84}
*{box-sizing:border-box}
html,body{margin:0;background:#050505;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif}
#app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);padding:18px 18px 110px;position:relative}
body.admin #app{max-width:1100px}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:2px;font-size:15px}
.brand img{height:30px;filter:invert(1)}
.lang button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:12px}
.lang button.on{color:var(--text);border-color:var(--red)}
h1{font-size:26px;margin:6px 0 8px;letter-spacing:-.3px}
h2{font-size:12px;margin:18px 0 8px;color:var(--red);text-transform:uppercase;letter-spacing:1.2px}
h3{margin:0 0 6px;font-size:17px}
p{color:var(--muted);line-height:1.55;margin:6px 0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card.hot{border-color:var(--red);background:linear-gradient(160deg,#1f0f0f,#141417)}
.btn{display:block;width:100%;background:var(--red);color:#fff;border:0;border-radius:12px;padding:15px;font-weight:800;font-size:16px;cursor:pointer;margin-top:12px;letter-spacing:.2px}
.btn:active{transform:scale(.99)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text)}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:13px;margin-top:0;border-radius:10px}
.btn.dark{background:var(--card2);border:1px solid var(--line);color:var(--text)}
.btn.danger{background:none;border:1px solid var(--red);color:var(--red)}
label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.6px}
input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0d0d10;color:var(--text);font-size:16px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red)}
.row{display:flex;gap:10px}.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card);cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:76px}
.opt.on{border-color:var(--red);background:#1d1012}
.opt b{font-size:15px}
.opt small{color:var(--muted);font-size:12px;line-height:1.4}
.opt img{width:100%;border-radius:10px;background:#fff;aspect-ratio:2/1;object-fit:contain;margin-bottom:6px}
.step{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.bar{height:4px;background:var(--line);border-radius:4px;margin:10px 0 18px;overflow:hidden}
.bar div{height:100%;background:var(--red);border-radius:4px;transition:width .3s}
.pill{display:inline-block;font-size:11px;border-radius:20px;padding:3px 9px;border:1px solid var(--line);color:var(--muted);letter-spacing:.3px}
.pill.red{border-color:var(--red);color:var(--red2)}
.pill.green{border-color:var(--green);color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:11px;background:#23232a;color:var(--text);border-radius:20px;padding:4px 10px}
.muted{color:var(--muted)}
.err{color:var(--red2);font-size:13px;margin:10px 0 0;background:#1d0f0f;border:1px solid #4a1a1a;border-radius:10px;padding:10px}
.ok{color:var(--green);font-size:13px;margin:10px 0 0;background:#0f1d15;border:1px solid #1d4a30;border-radius:10px;padding:10px}
.code{font-size:30px;font-weight:900;letter-spacing:8px;color:var(--red);text-align:center;padding:14px;background:#120a0a;border:1px dashed var(--red);border-radius:14px;margin:12px 0}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;color:var(--text);font-size:13px;line-height:1.5}
.chk input{width:auto;margin-top:3px;accent-color:var(--red)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;margin-top:12px;font-size:13px;padding:0}
.back{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:0;margin-bottom:6px}
.ex{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex .thumb{width:64px;height:48px;border-radius:10px;background:#fff;object-fit:contain;flex:none}
.ph{width:64px;height:48px;border-radius:10px;background:#1b1b20;border:1px dashed #3a3a42;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted);text-align:center;flex:none;line-height:1.2}
.ex .main{flex:1;min-width:0}
.ex .title{font-weight:700;font-size:15px}
.ex .plan{font-size:12px;color:var(--muted);margin-top:2px}
.ex .sugg{font-size:13px;color:var(--text);margin-top:4px}
.ex .sugg b{color:var(--red2)}
.ex .tip{font-size:11px;color:var(--muted);margin-top:2px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts .btn{margin-top:0}
.sets{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
.sets td{padding:5px 4px}
.sets input{padding:8px;font-size:14px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:rgba(10,10,11,.96);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(8px);z-index:5}
.nav button{flex:1;background:none;border:0;color:var(--muted);padding:12px 4px 14px;cursor:pointer;font-size:11px;letter-spacing:.4px;text-transform:uppercase}
.nav button.on{color:var(--red);font-weight:800}
.nav .dot{display:block;width:5px;height:5px;border-radius:50%;background:transparent;margin:0 auto 4px}
.nav button.on .dot{background:var(--red)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#0f0f12;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;width:100%;max-width:460px;max-height:88vh;overflow:auto;padding:20px 18px 28px}
.sheet .x{float:right;background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.imgs img{width:100%;background:#fff;border-radius:12px;aspect-ratio:2/1;object-fit:contain}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.stat{background:var(--card2);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px;margin-top:4px}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos figure{margin:0;background:var(--card2);border-radius:14px;padding:8px;border:1px solid var(--line)}
.photos img{width:100%;border-radius:10px;aspect-ratio:3/4;object-fit:cover;display:block}
.photos figcaption{font-size:11px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:6px;align-items:center}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
table.t th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
table.t tr:hover td{background:#17171c;cursor:pointer}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font-size:13px}
.kv div span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.kv div b{font-size:14px}
.hero{display:flex;justify-content:center;margin:8px 0 4px}
.hero img{height:120px;filter:invert(1);opacity:.95}
.sessionrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.sessionrow:last-child{border-bottom:0}
.pagebar{position:sticky;bottom:72px;background:rgba(11,11,12,.96);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:4}
.opt img[src*="bodytype"]{aspect-ratio:3/4;object-fit:contain;background:#fff}
.opt img[src*="onboard/"]{aspect-ratio:3/4;object-fit:contain;background:#fff}
.opt img[src*="onboard_gym"],.opt img[src*="onboard_home"]{aspect-ratio:16/9;object-fit:cover}
.ph{display:flex}
.map-wrap{position:relative;max-width:300px;margin:0 auto}
.map-wrap img{width:100%;display:block;border-radius:14px;background:#fff}
.hot-spot{position:absolute;border:none;background:transparent;border-radius:45%;cursor:pointer;padding:0}
.hot-spot.on{background:rgba(229,50,45,.78);border:1px solid #ff8a80;box-shadow:0 0 18px rgba(229,50,45,.55)}
.chips-wrap{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip-btn{background:#17171c;border:1px solid var(--line);color:var(--text);border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer}
.chip-btn.on{border-color:var(--red);background:#2a0f0f;color:#fff}
</style>
</head>

/* =====================================================================

   ===================================================================== */
function buildPlanGeneric(p){
  const allowed=p.mode==='gym'?2:(p.equip==='light'?1:0);
  const pool=cat=>EX_LIB.filter(e=>e.cat===cat&&e.eq<=allowed).sort((a,b)=>b.eq-a.eq);
  const pick=(cat,count,offset)=>{const pl=pool(cat),out=[];for(let i=0;i<pl.length&&out.length<count;i++){out.push(pl[(offset+i)%pl.length]);}return [...new Set(out)];};
  const scheme=p.mode==='gym'
    ?({lean:{s:3,r:'12–15',rest:'60 s'},medium:{s:3,r:'8–12',rest:'75 s'},muscular:{s:4,r:'6–10',rest:'2 min'}})[p.bodyType||'medium']
    :({lose:{s:3,r:'12–15',rest:'45 s'},maintain:{s:3,r:'10–12',rest:'60 s'},gain:{s:4,r:'8–12',rest:'75 s'}})[p.goal||'maintain'];
  const sets=p.exp==='beginner'?Math.max(2,scheme.s-1):scheme.s;
  const days=+p.days||3;
  let splits;
  if(days===2) splits=[{n:'Full body A',a:'A',p:[['legs',1],['push',1],['pull',1],['core',1]]},{n:'Full body B',a:'B',p:[['legs',1],['push',1],['pull',1],['core',1]]}];
  else if(days===3) splits=[{n:'Full body A',p:[['legs',1],['push',1],['pull',1],['core',1]]},{n:'Full body B',p:[['legs',1],['push',1],['pull',1],['core',1]]},{n:'Full body C',p:[['legs',1],['push',1],['pull',1],['core',1]]}];
  else if(days===4) splits=[{n:'Upper A',p:[['push',2],['pull',2]]},{n:'Lower A',p:[['legs',3],['core',1]]},{n:'Upper B',p:[['push',2],['pull',2]]},{n:'Lower B',p:[['legs',3],['core',1]]}];
  else splits=[{n:'Push',p:[['push',3],['core',1]]},{n:'Pull',p:[['pull',3],['core',1]]},{n:'Legs',p:[['legs',3],['core',1]]},{n:'Upper',p:[['push',2],['pull',2]]},{n:'Lower',p:[['legs',2],['core',1]]}];
  const templates=splits.map((s,di)=>{
    const items=[];
    s.p.forEach(([cat,count])=>{pick(cat,count,di).forEach(ex=>{
      if(items.some(i=>i.ex===ex.id)) return;
      items.push({ex:ex.id,sets:ex.time?sets:sets,reps:ex.time?'30–45 s':scheme.r,rest:scheme.rest});
    });});
    return {name:s.n,items};
  });
  return {templates,days:templates.length,weeks:(+p.months||1)*4};
}


/* ---- Female programs (from programs_female.json) ---- */
const PERMIT={gym:['gym','dumbbell','band','bodyweight'],light:['dumbbell','band','bodyweight'],none:['bodyweight']};
const canUse=(e,mode)=>(e.equipment||(e.eq===2?['gym']:(e.eq===1?['dumbbell','band']:['bodyweight']))).some(x=>PERMIT[mode].includes(x));
function fixExercise(id,mode){
  let cur=id;
  for(let k=0;k<5&&cur;k++){
    const e=EXID[cur]; if(!e) return null;
    if(canUse(e,mode)) return cur;
    const sub=PROGRAM_DATA.home_substitutions[cur];
    cur=(mode!=='gym'&&sub&&EXID[sub])?sub:e.easier;
  }
  return null;
}
function minutesText(t){
  const m=String(t||'').match(/(\d+)(?:\s*[-–]\s*(\d+))?\s*min/);
  if(!m) return '20 min';
  return m[2]?`${m[1]}–${m[2]} min`:`${m[1]} min`;
}
function jsonPlan(p){
  const key=p.mode==='gym'?p.bodyType:({lose:'slim_lean',maintain:'toned_sculpted',gain:'strong_curvy'})[p.goal||'maintain'];
  const prog=PROGRAM_DATA.programs[key]; if(!prog) return null;
  const mode=p.mode==='gym'?'gym':(p.equip==='light'?'light':'none');
  const adj=p.exp==='beginner'?-1:0;
  const templates=prog.days.map(d=>{
    const items=[];
    const add=(id,sets,reps,rest)=>{const fx=fixExercise(id,mode); if(!fx||items.some(x=>x.ex===fx)) return; items.push({ex:fx,sets:Math.max(2,sets+adj),reps,rest});};
    (d.strength||[]).forEach(s=>add(s.exercise,parseInt(s.sets,10)||2,s.reps,s.rest));
    if(d.core_block){
      const cb=PROGRAM_DATA.pilates_core_blocks[d.core_block.split('.')[1]];
      if(cb) cb.moves.forEach(m=>{const e=EXID[m]; add(m,2,(e&&e.time)?'30–40 s':'8–10','30 s');});
    }
    if(d.type==='cardio'){
      items.push({ex:'cardio',sets:1,reps:minutesText(d.cardio),rest:'0 s',note:[d.cardio,d.mobility].filter(Boolean).join(' · ')});
    } else if(d.cardio){
      items.push({ex:'cardio',sets:1,reps:minutesText(d.cardio),rest:'0 s',note:d.cardio});
    }
    return {name:d.name,items};
  });
  return {templates,days:templates.length,weeks:(+p.months||1)*4,source:'json'};
}
function buildPlan(p){
  if(p.sex==='female'){const j=jsonPlan(p); if(j) return j;}
  return buildPlanGeneric(p);
}

/* Starting weight estimate. Clearly labelled as an estimate on screen. */
function estStart(p,ex){
  if(!ex.f||ex.eq===0) return null;
  const expM={beginner:0.7,intermediate:1,advanced:1.25}[p.exp]||1;
  const sexM=p.sex==='female'?0.7:1;
  let pu=1;
  if(ex.up&&p.pushMax!=null){pu=p.pushMax<8?0.8:(p.pushMax>20?1.15:1);}
  let w=(+p.weight||70)*ex.f*expM*sexM*pu;
  if(ex.eq===1&&p.maxDb) w=Math.min(w,+p.maxDb);
  return r25(w);
}

function lastResult(u,exId){
  for(let i=u.sessions.length-1;i>=0;i--){
    const it=(u.sessions[i].items||[]).find(x=>x.ex===exId&&(x.status==='done'||x.status==='adjusted'));
    if(it&&it.sets&&it.sets.length){
      const kgs=it.sets.map(s=>s.kg).filter(k=>k!=null);
      return {kg:kgs.length?Math.max(...kgs):null,reps:it.sets.map(s=>+s.reps||0),pain:!!it.pain};
    }
  }
  return null;
}

/* Weight suggestion: a range-based rule, not a fixed number. */
function suggest(u,item){
  const ex=EXID[item.ex],p=u.profile,last=lastResult(u,item.ex),[lo,hi]=rangeOf(item.reps);
  if(ex.eq===0){
    if(!last) return {kg:null,tip:tx('Bodyweight. Start at the bottom of the range.','وزن الجسم. ابدأ من أقل عدد في النطاق.')};
    if(last.reps.every(r=>r>=hi)) return {kg:null,tip:tx('You reached the top of the range. Try a harder version.','وصلت إلى أعلى النطاق. جرّب نسخة أصعب.')};
    return {kg:null,tip:tx('Aim for the top of the range.','استهدف أعلى النطاق.')};
  }
  if(!last||last.kg==null){
    const w=estStart(p,ex);
    return {kg:w,estimate:true,tip:tx('First-session estimate. Adjust after your first set.','تقدير الجلسة الأولى. عدّل بعد أول مجموعة.')};
  }
  const inc=ex.low?5:2.5;
  let kg=last.kg,tip;
  if(last.pain){kg=r25(last.kg*0.9);tip=tx('Pain was reported last time. Lighter weight today.','تم الإبلاغ عن ألم في المرة السابقة. وزن أخف اليوم.');}
  else if(last.reps.every(r=>r>=hi)){kg=last.kg+inc;tip=tx('You beat the top of the range last time. Go up.','تجاوزت أعلى النطاق في المرة السابقة. ارفع الوزن.');}
  else if(last.reps.some(r=>r<lo)){kg=r25(last.kg*0.95);tip=tx('You fell below the range last time. Go down a little.','نزلت تحت النطاق في المرة السابقة. خفّف قليلاً.');}
  else tip=tx('Stay here and aim for the top of the range.','ابقَ على هذا الوزن واستهدف أعلى النطاق.');
  return {kg,tip};
}

const BT_GOAL={slim_lean:'lose',toned_sculpted:'maintain',strong_curvy:'gain',lean:'lose',medium:'maintain',muscular:'gain'};
function nextStep(s){let n=s+1;if(n===4&&me()&&me().profile.mode==='gym') n=5;return n;}
function backStep(s){let n=s-1;if(n===4&&me()&&me().profile.mode==='gym') n=3;return n;}
function pick(key,val,advance){
  const u=me();u.profile[key]=val;
  if(key==='bodyType') u.profile.goal=BT_GOAL[val];
  saveDB();UI.err='';UI.ok='';
  if(advance){UI.ob=nextStep(UI.ob||0);}
  render();
}
/* Accept decimals typed with '.' or ',' */
function num(x){return parseFloat(String(x==null?'':x).replace(',','.'));}
function obContinue(s){
  save();const f=UI.f,u=me(),p=u.profile;
  if(s===2){ if(f.maxDb!==undefined&&f.maxDb!==''&&(num(f.maxDb)<=0)) return fail(tx('Enter a weight above 0, or leave it empty.','أدخل وزناً أكبر من 0 أو اتركه فارغاً.')); p.maxDb=f.maxDb?num(f.maxDb):null; }
  if(s===3){
    if(!f.dob) return fail(tx('Enter your date of birth.','أدخل تاريخ ميلادك.'));
    if(!(num(f.height)>=120&&num(f.height)<=230)) return fail(tx('Enter a height between 120 and 230 cm.','أدخل طولاً بين 120 و230 سم.'));
    if(!(num(f.weight)>=30&&num(f.weight)<=250)) return fail(tx('Enter a weight between 30 and 250 kg.','أدخل وزناً بين 30 و250 كغ.'));
    p.dob=f.dob;p.height=num(f.height);p.weight=num(f.weight);
  }
  if(s===5){
    if(f.pushMax===''||f.pushMax==null) return fail(tx('Enter your best push-up count, or 0.','أدخل أفضل عدد تمارين ضغط، أو 0.'));
    p.exp=f.exp||p.exp||'beginner';p.pushMax=+f.pushMax;
  }
  if(s===8){
    const qKeys=['q1','q2','q3'].concat((f.sex||p.sex)==='male'?[]:['q4']);
    const yes=qKeys.some(k=>f[k]==='yes');
    const missing=qKeys.some(k=>!f[k]);
    if(missing) return fail(tx('Please answer all questions.','يرجى الإجابة عن جميع الأسئلة.'));
    if(yes){p.screen='stop';saveDB();return go('stop');}
    p.screen='ok';
  }
  saveDB();UI.err='';UI.ob=nextStep(s);UI.f={};render();
}
function finishSetup(){
  const u=me(),p=u.profile;
  p.setupDone=true;p.started=todayStr();
  if(!u.weights.length) u.weights.push({date:todayStr(),kg:+p.weight});
  saveDB();UI.ob=0;UI.f={};go('home');
}

function startWorkout(){
  const u=me(),p=u.profile,plan=buildPlan(p),n=u.sessions.filter(x=>!x.custom).length,tpl=plan.templates[n%plan.days];
  u.active={idx:n,week:Math.floor(n/plan.days)+1,day:tpl.name,startedAt:Date.now(),
    items:tpl.items.map(it=>({ex:it.ex,sets:it.sets,reps:it.reps,rest:it.rest,note:it.note||'',status:'pending',pain:false,logged:[]}))};
  UI.pi=null;UI.rest=null;UI.hold=null;saveDB();go('workout');
}
function itemPlanKg(u,item){return suggest(u,item).kg;}
function doneAsPlanned(i){
  const u=me(),it=u.active.items[i],[lo]=rangeOf(it.reps),ex=EXID[it.ex];
  const kg=ex.eq===0?null:suggest(u,it).kg;
  it.sets=Array.from({length:it.sets},()=>({reps:lo,kg}));
  it.status='done';saveDB();render();
}
function openEdit(i){UI.editing=i;render();}
function saveEdit(i){
  save();const u=me(),it=u.active.items[i],ex=EXID[it.ex],sug=suggest(u,it),[lo]=rangeOf(it.reps);
  it.sets=Array.from({length:it.sets},(_,k)=>{
    const r=UI.f['r_'+i+'_'+k],w=UI.f['w_'+i+'_'+k];
    return {reps:r!==undefined&&r!==''?+r:lo,kg:ex.eq===0?null:(w!==undefined&&w!==''?+w:sug.kg)};
  });
  it.status='adjusted';UI.editing=null;UI.f={};saveDB();render();
}
function skipItem(i){const u=me();u.active.items[i].status='skipped';saveDB();render();}
function togglePain(i){const u=me();u.active.items[i].pain=!u.active.items[i].pain;saveDB();render();}
function undoItem(i){const u=me();u.active.items[i].status='pending';u.active.items[i].sets=null;saveDB();render();}
function finishWorkout(){
  save();const u=me(),a=u.active;
  const loggedAny=a.items.some(i=>i.status==='done'||i.status==='adjusted');
  const allDone=a.items.every(i=>i.status==='done'||i.status==='adjusted');
  let res=UI.f.res||(allDone?'all':'partly');
  if(!loggedAny&&res!=='none') res='none';
  const rec={idx:a.idx,week:a.week,day:a.day,custom:!!a.custom,date:todayStr(),minutes:Math.max(1,Math.round((Date.now()-a.startedAt)/60000)),status:res,notes:(UI.f.notes||'').trim(),
    items:a.items.map(i=>({ex:i.ex,status:i.status,pain:!!i.pain,sets:i.logged||[]}))};
  u.sessions.push(rec);u.active=null;UI.f={};UI.pi=null;UI.rest=null;UI.hold=null;saveDB();
  UI.ok=tx('Workout saved. Well done.','تم حفظ التمرين. أحسنت.');
  go('home',true);
}
function abandonWorkout(){const u=me();if(!confirm(tx('Discard this workout? Nothing will be saved.','إلغاء هذا التمرين؟ لن يتم حفظ شيء.'))) return;u.active=null;saveDB();go('home');}

function addWeight(){
  save();const u=me(),kg=num(UI.f.w_new);
  if(!(kg>=30&&kg<=250)) return fail(tx('Enter a weight between 30 and 250 kg.','أدخل وزناً بين 30 و250 كغ.'));

  if(i>=0) u.weights[i].kg=kg; else u.weights.push({date:todayStr(),kg});
  u.weights.sort((a,b)=>a.date.localeCompare(b.date));
  UI.f={};saveDB();UI.ok=tx('Weight saved.','تم حفظ الوزن.');render();
}
function setPhotoConsent(){save();const u=me();if(!UI.f.photoConsent) return fail(tx('Please tick the privacy statement first.','يرجى تحديد بيان الخصوصية أولاً.'));u.consent.photos=todayStr();saveDB();UI.f={};render();}
function compressImg(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{const max=700,s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.8));};img.onerror=rej;img.src=r.result;};
    r.onerror=rej;r.readAsDataURL(file);
  });
}
function handlePhoto(input){
  const u=me(),file=input.files&&input.files[0];
  if(!file) return;
  if(!u.consent.photos){input.value='';return fail(tx('Confirm the privacy statement before you upload a photo.','أكد بيان الخصوصية قبل رفع الصورة.'));}
  compressImg(file).then(d=>{u.photos.push({id:uid(),date:todayStr(),data:d,share:false});saveDB();UI.ok=tx('Photo saved privately.','تم حفظ الصورة بشكل خاص.');render();}).catch(()=>fail(tx('That photo could not be read.','تعذر قراءة الصورة.')));
}
function toggleShare(id){const u=me(),ph=u.photos.find(p=>p.id===id);if(ph){ph.share=!ph.share;saveDB();render();}}
function deletePhoto(id){if(!confirm(tx('Delete this photo permanently?','حذف هذه الصورة نهائياً؟'))) return;const u=me();u.photos=u.photos.filter(p=>p.id!==id);saveDB();render();}
function weightOn(u,date){let w=null;for(const x of u.weights){if(x.date<=date)w=x;}return w||u.weights[0]||null;}
function photosDue(u){
  if(!u.photos.length) return 'start';
  const last=u.photos.reduce((a,b)=>a.date>b.date?a:b);
  return daysAgo(last.date)>=30?'monthly':null;
}

  saveDB();UI.f={};UI.ok=tx('Saved. Your plan is updated.','تم الحفظ. تم تحديث برنامجك.');render();
}

/* =====================================================================
   CHARTS
   ===================================================================== */
function lineChart(points){
  if(points.length<2) return `<p class="muted">${tx('Add at least two weigh-ins to see your trend.','أضف قياسين على الأقل لرؤية الاتجاه.')}</p>`;
  const w=320,h=150,pad=26,vals=points.map(p=>p.kg),min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||1;
  const xs=i=>pad+i*(w-2*pad)/(points.length-1);
  const ys=v=>h-pad-(v-min)/span*(h-2*pad);
  const poly=points.map((p,i)=>`${xs(i).toFixed(1)},${ys(p.kg).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" class="chart">
    <polyline points="${poly}" fill="none" stroke="#e5322d" stroke-width="3" stroke-linejoin="round"/>
    ${points.map((p,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${ys(p.kg).toFixed(1)}" r="4" fill="#e5322d"/>`).join('')}
    <text x="4" y="14" fill="#9a9aa3" font-size="11">${max} kg</text>
    <text x="4" y="${h-6}" fill="#9a9aa3" font-size="11">${min} kg</text>
    <text x="${w-4}" y="${h-6}" fill="#9a9aa3" font-size="11" text-anchor="end">${fdate(points[points.length-1].date)}</text>
  </svg>`;
}

const PARTS=[
  {k:'chest',en:'Chest',ar:'الصدر',map:['chest'],boxes:[[36,27,28,10]]},
  {k:'shoulders',en:'Shoulders',ar:'الكتفان',map:['shoulders'],boxes:[[17,16,11,8],[72,16,11,8]]},
  {k:'arms',en:'Arms',ar:'الذراعان',map:['biceps','triceps'],boxes:[[18,28,9,16],[73,28,9,16]]},
  {k:'core',en:'Core',ar:'البطن',map:['core'],boxes:[[40,38,20,11]]},
  {k:'quads',en:'Quads',ar:'الفخذ الأمامي',map:['quads'],boxes:[[34,50,15,17],[51,50,15,17]]},
  {k:'calves',en:'Calves',ar:'الربلة',map:['calves'],boxes:[[36,70,13,17],[51,70,13,17]]},
  {k:'back',en:'Back',ar:'الظهر',map:['back'],boxes:[]},
  {k:'glutes',en:'Glutes',ar:'الأرداف',map:['glutes'],boxes:[]},
  {k:'hamstrings',en:'Hamstrings',ar:'الفخذ الخلفي',map:['hamstrings'],boxes:[]}
];
function partsExercises(u,sel){
  const p=u.profile,mode=p.mode==='gym'?'gym':(p.equip==='light'?'light':'none');
  const out=[];
  sel.forEach(k=>{
    const part=PARTS.find(x=>x.k===k); if(!part) return;
    const cands=Object.values(EXID).filter(e=>e.id!=='cardio'&&e.hl&&e.hl.some(h=>part.map.includes(h))&&canUse(e,mode))
      .sort((a,b)=>{const sc=e=>e.hl.filter(h=>part.map.includes(h)).length/Math.max(1,e.hl.length);return (sc(b)-sc(a))||(mode==='gym'?b.eq-a.eq:0);});
    cands.slice(0,2).forEach(e=>{if(!out.includes(e.id)) out.push(e.id);});
  });
  return out;
}
function partsName(sel){return sel.map(k=>{const x=PARTS.find(y=>y.k===k);return x?L(x):k;}).join(' · ');}
function togglePart(k){UI.parts=UI.parts||[];UI.parts=UI.parts.includes(k)?UI.parts.filter(x=>x!==k):UI.parts.concat([k]);render();}
function startPartsWorkout(){
  const u=me(),sel=UI.parts||[],ids=partsExercises(u,sel);
  if(!ids.length) return fail(tx('Choose at least one body part.','اختر عضلة واحدة على الأقل.'));
  const rest=u.profile.mode==='gym'?'75 s':'60 s';
  const items=ids.map(id=>({ex:id,sets:3,reps:EXID[id].low?'8–12':'10–12',rest,note:'',status:'pending',pain:false,logged:[]}));
  u.active={idx:u.sessions.filter(x=>!x.custom).length,week:0,custom:true,day:partsName(sel),startedAt:Date.now(),items};
  UI.pi=null;UI.rest=null;UI.hold=null;UI.setTimer=null;UI.parts=[];saveDB();go('workout');
}
SCREENS.parts=()=>{
  const u=me(),sex=u.profile.sex||'male',sel=UI.parts||[],ids=partsExercises(u,sel);
  const spots=PARTS.filter(x=>x.boxes.length).map(x=>x.boxes.map(([l,t,w,h])=>`<button class="hot-spot ${sel.includes(x.k)?'on':''}" style="left:${l}%;top:${t}%;width:${w}%;height:${h}%" onclick="togglePart('${x.k}')" aria-label="${L(x)}"></button>`).join('')).join('');

  <div class="map-wrap"><img src="images/onboard/onboard_${sex==='female'?'female':'male'}.webp" alt="">${spots}</div>
  <div class="chips-wrap">${chips}</div>
  <h2>${tx('Your exercises','تمارينك')}</h2>
  <div class="card">${preview||`<p class="muted">${tx('Choose a body part to see exercises.','اختر عضلة لرؤية التمارين.')}</p>`}</div>
  <button class="btn" onclick="startPartsWorkout()" ${ids.length?'':'disabled'}>${tx('Build my workout','أنشئ تمريني')}</button>

};

/* ---- Workout player: timers, sets, rest, cardio ---- */
const mmss=ms=>{const t=Math.max(0,Math.floor(ms/1000));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');};
const restSecs=s=>{const m=String(s||'').match(/\d+/);const n=m?+m[0]:60;return /min/.test(String(s||''))?n*60:n;};
const firstOpen=a=>{const i=a.items.findIndex(x=>x.status==='pending');return i<0?0:i;};
function nextPending(a,from){
  for(let k=from+1;k<a.items.length;k++) if(a.items[k].status==='pending') return k;
  for(let k=0;k<a.items.length;k++) if(a.items[k].status==='pending') return k;
  return -1;
}
function estMinutes(a){
  let secs=0;
  a.items.forEach(it=>{
    if(it.ex==='cardio'){secs+=(rangeOf(it.reps)[0]||20)*60;return;}
    secs+=it.sets*(40+restSecs(it.rest));
  });
  return Math.round(secs/60);
}
function updateTimers(){
  const u=me(); if(!u||!u.active) return;
  const el=document.getElementById('elapsed'); if(el) el.textContent=mmss(Date.now()-u.active.startedAt);
  if(UI.rest&&!UI.rest.done){
    const left=UI.rest.end-Date.now();
    const rt=document.getElementById('restLeft'); if(rt) rt.textContent=mmss(left);
    const bar=document.getElementById('restBar'); if(bar) bar.style.width=Math.max(0,Math.min(100,(1-left/(UI.rest.total*1000))*100))+'%';
    if(left<=0){UI.rest.done=true; try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){} render();}
  }
  if(UI.hold&&!UI.hold.done){
    const left=UI.hold.end-Date.now();
    const ht=document.getElementById('holdLeft'); if(ht) ht.textContent=mmss(left);
    if(left<=0){UI.hold.done=true; try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){} render();}
  }
  if(UI.setTimer){const se=document.getElementById('setTimer'); if(se) se.textContent=mmss(Math.max(0,Date.now()-UI.setTimer.start));}
  const it=u.active.items[UI.pi];
  if(it&&it.cardioEnd&&!it.cardioDone){
    const left=it.cardioEnd-Date.now();
    const ct=document.getElementById('cardioLeft'); if(ct) ct.textContent=mmss(left);
    if(left<=0){it.cardioDone=true; saveDB(); try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){} render();}
  }
}

 step_up:{en:{setup:["Stand facing a sturdy bench.","Place one whole foot on the bench, heel down, weight in that heel."],move:["Drive up through the front foot until you stand tall on the bench.","Bring the other leg up to meet it, or hold briefly.","Step down with control and switch legs."],breathe:"Breathe out as you step up. Breathe in as you step down.",avoid:["pushing off the back foot","leaning forward excessively","stepping up with only the toes"]},ar:{setup:["قف مواجهاً لمقعد متين.","ضع القدم كاملة على المقعد، والكعب على السطح مع تحميل الوزن على هذا الكعب."],move:["ادفع عبر القدم الأمامية حتى تقف منتصباً على المقعد.","اجمع الساق الأخرى معها، أو توقف لحظة.","انزل بتحكم وبدّل الساقين."],breathe:"أخرج النفس أثناء الصعود، وخذ النفس أثناء النزول.",avoid:["الدفع بالقدم الخلفية","الميل للأمام بشدة","الصعود بأطراف الأصابع فقط"]}},
 lateral_raise:{en:{setup:["Stand tall with a light dumbbell in each hand at your sides.","Slight bend in the elbows, palms facing your body."],move:["Raise the arms out to the sides until they reach shoulder height.","Pause briefly, keeping the elbows slightly bent.","Lower slowly back to the sides."],breathe:"Breathe out as you raise. Breathe in as you lower.",avoid:["shrugging the shoulders","swinging the body","raising the arms above shoulder height"]},ar:{setup:["قف منتصباً ودمبل خفيف في كل يد بجانب الجسم.","انحناءة خفيفة في المرفقين، والكفان متجهان نحو الجسم."],move:["ارفع الذراعين إلى الجانبين حتى يصلا إلى مستوى الكتف.","توقف لحظة مع إبقاء المرفقين منحنيين قليلاً.","أنزل ببطء إلى الجانبين."],breathe:"أخرج النفس أثناء الرفع، وخذ النفس أثناء الإنزال.",avoid:["رفع الكتفين","تأرجح الجسم","رفع الذراعين فوق مستوى الكتف"]}},
 band_row:{en:{setup:["Anchor the band at about chest height in front of you.","Step back to create tension, hinge the torso slightly forward, back flat."],move:["Pull the hands toward the lower ribs, elbows back.","Squeeze the shoulder blades together.","Return slowly until the arms are straight."],breathe:"Breathe out as you pull. Breathe in as you return.",avoid:["rounding the back","leaning back to pull","jerking the band"]},ar:{setup:["ثبّت الحزام عند مستوى الصدر تقريباً أمامك.","ابتعد للخلف لتوليد الشد، واملِ الجذع قليلاً للأمام مع بقاء الظهر مستقيماً."],move:["اسحب اليدين نحو الأضلاع السفلية، والكوعان إلى الخلف.","اضغط لوحي الكتف معاً.","عد ببطء حتى تستقيم الذراعان."],breathe:"أخرج النفس أثناء السحب، وخذ النفس أثناء العودة.",avoid:["تقوس الظهر","الميل للخلف أثناء السحب","جذب الحزام بعنف"]}},
 clamshell:{en:{setup:["Lie on one side, hips and shoulders stacked.","Knees bent, feet together, head resting on the bottom arm."],move:["Keep the feet together and open the top knee like a clamshell.","Pause at the top without rolling the hips back.","Close the knee slowly."],breathe:"Breathe out as you open. Breathe in as you close.",avoid:["rolling the hips backward","moving too fast","lifting the feet apart from the hip"]},ar:{setup:["استلق على جانب واحد والوركان والكتفان في خط واحد.","الركبتان مثنيتان والقدمان متلاصقتان، والرأس على الذراع السفلية."],move:["أبقِ القدمين متلاصقتين وافتح الركبة العليا كالمحارة.","توقف في الأعلى دون دحرجة الوركين للخلف.","أغلق الركبة ببطء."],breathe:"أخرج النفس أثناء الفتح، وخذ النفس أثناء الإغلاق.",avoid:["دحرجة الوركين للخلف","الحركة بسرعة كبيرة","رفع القدمين عن الورك"]}},
 band_pulldown:{en:{setup:["Anchor the band above your head.","Grip the band with both hands, arms straight overhead."],move:["Pull the elbows down toward the sides of the body.","Squeeze the lats at the bottom.","Return slowly until the arms are overhead again."],breathe:"Breathe out as you pull down. Breathe in as you return.",avoid:["shrugging the shoulders","leaning back to pull","letting the arms drift forward"]},ar:{setup:["ثبّت الحزام فوق رأسك.","أمسك الحزام بكلتا اليدين والذراعان ممدودتان فوق الرأس."],move:["اسحب المرفقين نحو جانبي الجسم.","اضغط عضلات الظهر العريضة في الأسفل.","عد ببطء حتى تعود الذراعان فوق الرأس."],breathe:"أخرج النفس أثناء السحب للأسفل، وخذ النفس أثناء العودة.",avoid:["رفع الكتفين","الميل للخلف أثناء السحب","انجراف الذراعين للأمام"]}},
 wall_pushup:{en:{setup:["Stand about an arm's length from a wall, feet flat.","Hands flat on the wall at shoulder height and shoulder-width apart."],move:["Bend the elbows and lean the chest toward the wall.","Press back to the start until the arms are straight."],breathe:"Breathe in as you lean in. Breathe out as you press back.",avoid:["sagging hips","flaring the elbows wide","moving the feet"]},ar:{setup:["قف على بعد ذراع من الحائط، والقدمان مسطحتان.","الكفان على الحائط بمستوى الكتف وبعرض الكتفين."],move:["اثنِ المرفقين واقترب بالصدر من الحائط.","ادفع للعودة إلى وضع البداية حتى تستقيم الذراعان."],breathe:"خذ النفس أثناء الاقتراب، وأخرجه أثناء الدفع.",avoid:["ترهل الوركين","فتح المرفقين على نطاق واسع","تحريك القدمين"]}},
 lat_pulldown:{en:{setup:["Sit at the machine with thighs under the pads.","Grip the bar wider than shoulder-width, arms straight up."],move:["Pull the bar down to the upper chest, elbows down and in.","Keep the chest up with only a slight lean back.","Return slowly until the arms are nearly straight."],breathe:"Breathe out as you pull down. Breathe in as you return.",avoid:["leaning back too far","pulling the bar behind the neck","shrugging the shoulders"]},ar:{setup:["اجلس على الجهاز والفخذان تحت الوسادات.","أمسك القضيب بعرض أكبر من عرض الكتفين، والذراعان ممدودتان للأعلى."],move:["اسحب القضيب نحو أعلى الصدر، والمرفقان للأسفل وللداخل.","أبقِ الصدر مرفوعاً مع ميل خفيف للخلف.","عد ببطء حتى تكاد الذراعان تستقيمان."],breathe:"أخرج النفس أثناء السحب للأسفل، وخذ النفس أثناء العودة.",avoid:["الميل للخلف بشدة","سحب القضيب خلف الرقبة","رفع الكتفين"]}},
 dumbbell_shoulder_press:{en:{setup:["Sit upright on a bench with back support.","Dumbbells at shoulder height, palms facing forward."],move:["Press the dumbbells up until the arms are nearly straight, not locked.","Lower slowly back to shoulder height."],breathe:"Breathe out as you press up. Breathe in as you lower.",avoid:["arching the lower back","bouncing the weights","letting the elbows drop below the shoulders at the bottom"]},ar:{setup:["اجلس منتصباً على مقعد مع مسند للظهر.","الدمبلان بمستوى الكتف، والكفان للأمام."],move:["ادفع الدمبلين للأعلى حتى تكاد الذراعان تستقيمان دون قفل المرفقين.","أنزل ببطء إلى مستوى الكتف."],breathe:"أخرج النفس أثناء الدفع للأعلى، وخذ النفس أثناء الإنزال.",avoid:["تقوس أسفل الظهر","ارتداد الأوزان","ترك المرفقين تنخفض تحت مستوى الكتف في الأسفل"]}},
 incline_dumbbell_press:{en:{setup:["Set the bench to about 30 degrees.","Dumbbells at the upper chest, palms facing forward, shoulder blades back."],move:["Press the dumbbells up over the upper chest.","Lower to chest level with the elbows about 45 degrees from the body."],breathe:"Breathe out as you press up. Breathe in as you lower.",avoid:["flaring the elbows wide","bouncing the dumbbells off the chest","lifting the hips off the bench"]},ar:{setup:["اضبط المقعد على زاوية 30 درجة تقريباً.","الدمبلان عند أعلى الصدر، والكفان للأمام ولوحا الكتف للخلف."],move:["ادفع الدمبلين للأعلى فوق أعلى الصدر.","أنزل إلى مستوى الصدر والمرفقان بزاوية 45 درجة تقريباً عن الجسم."],breathe:"أخرج النفس أثناء الدفع للأعلى، وخذ النفس أثناء الإنزال.",avoid:["فتح المرفقين على نطاق واسع","ارتداد الدمبلين عن الصدر","رفع الوركين عن المقعد"]}},
 seated_cable_row:{en:{setup:["Sit with feet on the platform, knees slightly bent.","Arms extended forward, holding the handle, back upright."],move:["Pull the handle to the lower ribs, elbows back.","Squeeze the shoulder blades together.","Return slowly until the arms are straight, without rounding forward."],breathe:"Breathe out as you pull. Breathe in as you return.",avoid:["leaning back to pull","rounding the back","shrugging the shoulders"]},ar:{setup:["اجلس والقدمان على المنصة، والركبتان مثنيتان قليلاً.","الذراعان ممدودتان للأمام وتمسكان المقبض، والظهر منتصب."],move:["اسحب المقبض نحو الأضلاع السفلية، والكوعان إلى الخلف.","اضغط لوحي الكتف معاً.","عد ببطء حتى تستقيم الذراعان دون الانحناء للأمام."],breathe:"أخرج النفس أثناء السحب، وخذ النفس أثناء العودة.",avoid:["الميل للخلف أثناء السحب","تقوس الظهر","رفع الكتفين"]}},
 hammer_curl:{en:{setup:["Stand with a dumbbell in each hand, palms facing your body.","Elbows close to the sides of the torso."],move:["Curl the dumbbells up toward the shoulders, keeping the thumbs facing forward.","Keep the elbows still.","Lower slowly until the arms are straight."],breathe:"Breathe out as you curl. Breathe in as you lower.",avoid:["swinging the body","elbows drifting forward","shrugging the shoulders"]},ar:{setup:["قف ودمبل في كل يد، والكفان متجهان نحو الجسم.","المرفقان قريبان من جانبي الجذع."],move:["ارفع الدمبلين نحو الكتفين، مع إبقاء الإبهامين متجهين للأمام.","أبقِ المرفقين ثابتين.","أنزل ببطء حتى تستقيم الذراعان."],breathe:"أخرج النفس أثناء الرفع، وخذ النفس أثناء الإنزال.",avoid:["تأرجح الجسم","انجراف المرفقين للأمام","رفع الكتفين"]}},
 triceps_pushdown:{en:{setup:["Stand at a cable machine facing it, elbows at the sides.","Grip the bar overhand, shoulder-width apart."],move:["Push the bar down by straightening the elbows fully.","Pause briefly at the bottom.","Return slowly until the forearms are at about 90 degrees."],breathe:"Breathe out as you push down. Breathe in as you return.",avoid:["elbows moving away from the sides","leaning forward to push","shoulders rising"]},ar:{setup:["قف أمام جهاز الكابل مواجهاً له، والمرفقان بجانب الجسم.","أمسك القضيب من الأعلى بعرض الكتفين."],move:["ادفع القضيب للأسفل بمد المرفقين بالكامل.","توقف لحظة في الأسفل.","عد ببطء حتى يصبح الساعدان بزاوية 90 درجة تقريباً."],breathe:"أخرج النفس أثناء الدفع للأسفل، وخذ النفس أثناء العودة.",avoid:["ابتعاد المرفقين عن الجانبين","الميل للأمام أثناء الدفع","ارتفاع الكتفين"]}},
 chest_fly:{en:{setup:["Lie on a flat bench, feet flat on the floor.","Dumbbells above the chest, palms facing each other, elbows with a slight fixed bend of about 10 to 15 degrees."],move:["Open the arms in a wide arc until the upper arms are level with the bench.","Squeeze the chest to bring the dumbbells back along the same arc."],breathe:"Breathe in as you open. Breathe out as you close.",avoid:["bending the elbows into a press","dropping the dumbbells quickly","going below bench level"]},ar:{setup:["استلق على مقعد مسطح والقدمان مسطحتان على الأرض.","الدمبلان فوق الصدر والكفان متقابلان، والمرفقان منحنيان بانحناءة ثابتة خفيفة بين 10 و15 درجة."],move:["افتح الذراعين في قوس واسع حتى يصبح العضدان موازيين للمقعد.","اضغط الصدر لإعادة الدمبلين على القوس نفسه."],breathe:"خذ النفس أثناء الفتح، وأخرجه أثناء الإغلاق.",avoid:["ثني المرفقين فتتحول الحركة إلى ضغط","إسقاط الدمبلين بسرعة","النزول تحت مستوى المقعد"]}},
 pushup:{en:{setup:["Hands on the floor under the shoulders, slightly wider than shoulder-width.","Body in one straight line from head to heels."],move:["Lower the chest toward the floor, elbows about 45 degrees from the body.","Press back up until the arms are straight."],breathe:"Breathe in as you lower. Breathe out as you press up.",avoid:["sagging or raised hips","flaring the elbows wide","dropping the head forward"]},ar:{setup:["الكفان على الأرض تحت الكتفين، وأوسع قليلاً من عرض الكتفين.","الجسم في خط مستقيم واحد من الرأس إلى الكعبين."],move:["أنزل الصدر نحو الأرض، والمرفقان بزاوية 45 درجة تقريباً عن الجسم.","ادفع للعودة حتى تستقيم الذراعان."],breathe:"خذ النفس أثناء النزول، وأخرجه أثناء الدفع للأعلى.",avoid:["ترهل الوركين أو رفعهما","فتح المرفقين على نطاق واسع","إسقاط الرأس للأمام"]}},
 face_pull:{en:{setup:["Set the rope at about eye height on a cable machine.","Overhand grip, shoulder-width apart, step back for tension, torso upright."],move:["Pull the rope toward the face, leading with the elbows, elbows high and wide.","Finish with the hands beside the ears, knuckles rotated up and back.","Return slowly without losing the elbow height."],breathe:"Breathe out as you pull. Breathe in as you return.",avoid:["leaning back","dropping the elbows below shoulder height","shrugging the shoulders"]},ar:{setup:["اضبط الحبل عند مستوى العين تقريباً على جهاز الكابل.","قبضة من الأعلى بعرض الكتفين، وتراجع خطوة لتوليد الشد، والجذع منتصب."],move:["اسحب الحبل نحو الوجه، مع قيادة المرفقين، والمرفقان عاليان وبعيدان.","أنهِ الحركة بوضع اليدين بجانب الأذنين، مع تدوير المفاصل للأعلى وللخلف.","عد ببطء دون فقدان ارتفاع المرفقين."],breathe:"أخرج النفس أثناء السحب، وخذ النفس أثناء العودة.",avoid:["الميل للخلف","إنزال المرفقين تحت مستوى الكتف","رفع الكتفين"]}},
 one_arm_dumbbell_row:{en:{setup:["Place one knee and the same hand on a flat bench, back flat and parallel to the floor.","Hold the dumbbell in the free hand, arm hanging straight down.","Feet planted, head in line with the spine."],move:["Pull the dumbbell up toward the ribcage, elbow close to the body.","Pause briefly with the shoulder blade squeezed back.","Lower slowly until the arm is straight."],breathe:"Breathe out as you pull up. Breathe in as you lower.",avoid:["rounding the back","twisting the hips","jerking the weight up"]},ar:{setup:["ضع ركبة واحدة واليد المقابلة لها على مقعد مسطح، والظهر مستقيم وموازٍ للأرض.","امسك الدمبل باليد الحرة وذراعك مرخية نحو الأرض.","القدمان ثابتتان والرأس في استقامة مع العمود الفقري."],move:["اسحب الدمبل نحو الصدر، والكوع قريب من الجسم.","توقف لحظة في الأعلى مع ضغط لوح الكتف للخلف.","أنزل ببطء حتى تستقيم الذراع."],breathe:"أخرج النفس أثناء السحب، وخذ النفس أثناء الإنزال.",avoid:["تقويس الظهر","لف الوركين","جذب الوزن بحركة مفاجئة"]}},
 leg_press:{en:{setup:["Sit with the back and head flat against the pad.","Feet shoulder-width apart on the platform, toes slightly out.","Release the safety catch before pressing."],move:["Press the platform away by extending the legs.","Stop just short of locking the knees.","Lower with control until the knees reach about 90 degrees."],breathe:"Breathe out as you press. Breathe in as you lower.",avoid:["locking the knees","lifting the lower back off the pad","knees caving inward"]},ar:{setup:["اجلس والظهر والرأس ملتصقان بالوسادة.","القدمان على المنصة بعرض الكتفين وأصابعهما مائلة قليلاً للخارج.","افتح مشبك الأمان قبل الدفع."],move:["ادفع المنصة بعيداً بمد الساقين.","توقف قبل قفل الركبتين.","أنزل بتحكم حتى تصل الركبتان إلى حوالي 90 درجة."],breathe:"أخرج النفس أثناء الدفع، وخذ النفس أثناء الإنزال.",avoid:["قفل الركبتين","رفع أسفل الظهر عن الوسادة","انحراف الركبتين إلى الداخل"]}},

function instrHTML(id,ex){

  const list=a=>a.map(x=>`<li style="margin:3px 0">${x}</li>`).join('');
  return `<div class="card" style="margin:10px 0;font-size:14px;line-height:1.5">
    <b style="color:var(--red2)">Setup</b><ol style="margin:4px 0 10px;padding-inline-start:20px;color:var(--text)">${list(I.setup)}</ol>
    <b style="color:var(--red2)">Movement</b><ol style="margin:4px 0 10px;padding-inline-start:20px;color:var(--text)">${list(I.move)}</ol>

    <p style="color:var(--text);margin:6px 0"><b>Avoid:</b> ${I.avoid.join(', ')}</p>

}

  const lo=rangeOf(it.reps)[0];
  const r=(UI.f['pr_'+i]!==undefined&&UI.f['pr_'+i]!=='')?+UI.f['pr_'+i]:lo;
  const kg=ex.eq===0?null:((UI.f['pk_'+i]!==undefined&&UI.f['pk_'+i]!=='')?+UI.f['pk_'+i]:suggest(u,it).kg);
  it.logged=(it.logged||[]).concat([{reps:r,kg}]);
  UI.f={};UI.hold=null;UI.setTimer=null;
  if(it.logged.length>=it.sets){
    it.status='done';UI.rest=null;
    const nx=nextPending(a,i);UI.pi=nx<0?i:nx;
  } else {
    const t=restSecs(it.rest);
    UI.rest={end:Date.now()+t*1000,total:t,done:false};
    UI.setTimer={i,start:Date.now()+t*1000};
  }
  saveDB();render();
}

SCREENS.workout=()=>{
  const u=me();
  if(!u.active) return SCREENS.home();
  const a=u.active;
  if(UI.pi==null||UI.pi<0||UI.pi>=a.items.length) UI.pi=firstOpen(a);
  const i=UI.pi,it=a.items[i];

  const isCardio=it.ex==='cardio', isHold=!!ex.time && !isCardio;
  const k=(it.logged||[]).length;
  const [lo,hi]=rangeOf(it.reps);
  const sug=(isCardio||ex.eq===0)?{kg:null,tip:''}:suggest(u,it);
  const totalSets=a.items.reduce((s,x)=>s+(x.ex==='cardio'?1:x.sets),0);

  let card='';

      <div class="chips">${(ex.hl||[]).map(m=>`<span class="chip">${L(MUSCLE_NAME[m]||{en:m,ar:m})}</span>`).join('')}</div>
      <p style="color:var(--text);font-size:16px;margin:6px 0 4px">${L(ex.cue||{en:'',ar:''})}</p>
      ${ex.easier&&EXID[ex.easier]?`<p class="muted" style="font-size:12px;margin:0 0 6px">${tx('Easier option','خيار أسهل')}: ${L(EXID[ex.easier].n)}</p>`:''}
      <div class="row" style="margin-top:8px">
        <div><label>${isHold?tx('Seconds held','ثوانٍ'):tx('Reps done','التكرارات')}</label><input type="number" inputmode="numeric" data-k="pr_${i}" value="${isHold?hi:lo}"></div>
        ${ex.eq===0?'':`<div><label>${tx('Weight (kg)','الوزن (كغ)')}</label><input type="text" inputmode="decimal" data-k="pk_${i}" value="${sug.kg!=null?sug.kg:''}"></div>`}
      </div>
      ${ex.eq===0?'':`<p style="font-size:13px;margin:8px 0">${tx('Suggested','المقترح')}: <b style="color:var(--red2)">${sug.kg!=null?sug.kg+' kg':'—'}</b>${sug.estimate?` <span class="muted">(${tx('estimate','تقدير')})</span>`:''}<br><span class="muted" style="font-size:12px">${esc(sug.tip||'')}</span></p>`}
      ${isHold?`<div class="card" style="text-align:center;margin:10px 0"><div class="step">${tx('Hold timer','مؤقت الثبات')}</div>
        <div class="big" id="holdLeft" style="font-size:40px;font-weight:900">${UI.hold&&UI.hold.i===i&&!UI.hold.done?mmss(UI.hold.end-Date.now()):mmss(hi*1000)}</div>

  }
  const list=a.items.map((x,idx)=>{

  const doneAll=a.items.every(x=>x.status==='done'||x.status==='skipped');
  return `${topHTML()}
  <button class="back" onclick="go('home')">${tx('‹ Today','‹ اليوم')}</button>
  <div class="row" style="align-items:flex-end">

  <div class="bar"><div style="width:${totalSets?Math.round(doneSets/totalSets*100):0}%"></div></div>
  ${msgHTML()}
  <div class="card hot">
    <div class="step">${tx('Exercise','التمرين')} ${i+1} / ${a.items.length}</div>
    <h2 style="margin:4px 0 8px;color:var(--text);font-size:22px;text-transform:none;letter-spacing:0">${L(ex.n)}</h2>

  <h2>${tx('This session','هذه الجلسة')}</h2>
  <div class="card" style="padding:6px 14px">${list}</div>

/* ---- Progress dashboard ---- */
function weekBars(u){
  const out=[];
  for(let w=7;w>=0;w--) out.push(u.sessions.filter(s=>{const d=daysAgo(s.date);return d>=w*7&&d<=w*7+6&&s.status!=='none';}).length);
  return out;
}
function barChart(vals){
  const w=320,h=140,pad=18,max=Math.max(4,...vals),slot=(w-pad*2)/vals.length,bw=slot-8;
  return `<svg viewBox="0 0 ${w} ${h}" class="chart">${vals.map((v,i)=>{
    const bh=(v/max)*(h-pad*2-14),x=pad+i*slot+4,y=h-pad-bh-0;
    const label=(vals.length-1-i)===0?tx('now','الآن'):'-'+(vals.length-1-i);
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${v?'#e5322d':'#2a2a30'}"/>`+
      (v?`<text x="${(x+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" fill="#f4f4f5" font-size="11" text-anchor="middle">${v}</text>`:'')+
      `<text x="${(x+bw/2).toFixed(1)}" y="${h-2}" fill="#9a9aa3" font-size="10" text-anchor="middle">${label}</text>`;
  }).join('')}</svg>`;
}
function strengthExercises(u){
  const ids=new Set();
  u.sessions.forEach(s=>(s.items||[]).forEach(it=>{if(it.ex!=='cardio'&&(it.sets||[]).some(x=>x.kg!=null)) ids.add(it.ex);}));
  return [...ids].filter(id=>EXID[id]);
}
function strengthSeries(u,exId){
  const pts=[];
  u.sessions.forEach(s=>{
    const it=(s.items||[]).find(x=>x.ex===exId);
    if(it&&it.sets&&it.sets.length){const kgs=it.sets.map(x=>x.kg).filter(k=>k!=null);if(kgs.length) pts.push({date:s.date,kg:Math.max(...kgs)});}
  });
  return pts;
}
function setStrEx(){save();UI.strEx=UI.f.strEx;UI.f={};render();}

  <p style="text-align:center;font-size:12px;margin:10px 0"><button onclick="openLegal('profile','terms')" style="background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:12px">${tx('Terms','الشروط')}</button> · <button onclick="openLegal('profile','privacy')" style="background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:12px">${tx('Privacy','الخصوصية')}</button> · <button onclick="openLegal('profile','health')" style="background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:12px">${tx('Health disclaimer','إخلاء المسؤولية الصحية')}</button></p>
  <div class="card"><h3>${esc(u.name)}</h3><p>${esc(u.email)}<br>${esc(u.phone)}<br>${esc(countryName(u.country))}${u.emirate?' · '+esc(u.emirate):''}</p></div>
  <div class="card"><h3>${tx('Your details','بياناتك')}</h3><div class="kv">
    <div><span>${tx('Sex','الجنس')}</span><b>${p.sex==='male'?tx('Male','ذكر'):tx('Female','أنثى')}</b></div>
    <div><span>${tx('Height','الطول')}</span><b>${p.height} cm</b></div>
    <div><span>${tx('Goal','الهدف')}</span><b>${({lose:tx('Lose weight','إنقاص الوزن'),maintain:tx('Maintain','الحفاظ'),gain:tx('Gain weight','زيادة الوزن')})[p.goal]||'—'}</b></div>
    <div><span>${tx('Training','التدريب')}</span><b>${p.mode==='gym'?tx('Gym','صالة'):tx('Home','منزل')}</b></div>
  </div></div>
  <div class="card" style="font-size:13px"><b>${tx('Privacy','الخصوصية')}</b>
    <p>${tx('Your progress photos are private to you. Coaches see your weight, measurements, sessions and goal so they can support your training. Your photos are not shared unless you choose to share a specific photo.','صور تقدمك خاصة بك. يرى المدرب وزنك وقياساتك وجلساتك وهدفك ليدعم تدريبك. لا تُشارك صورك إلا إذا اخترت مشاركة صورة معينة.')}</p>
  </div>
  <button class="btn ghost" onclick="logout()">${tx('Log out','تسجيل الخروج')}</button>
  <div style="text-align:center"><button class="link" onclick="deleteAccount()">${tx('Delete my account and data','حذف حسابي وبياناتي')}</button></div>
  ${navHTML()}`;
};

/* ---- Sheets (exercise info, finish) ---- */
function sheetHTML(){
  const s=UI.sheet;if(!s) return '';
  const u=me();
  if(s.type==='ex'){
    const ex=EXID[s.id],sex=(u&&u.profile.sex)||'male';
    const pics=ex.photo?`<div class="imgs"><img src="${EX_PHOTO(ex,sex,'pos1')}" alt=""><img src="${EX_PHOTO(ex,sex,'pos2')}" alt=""></div><p class="muted" style="font-size:12px">${tx('Up position · Down position','وضع الصعود · وضع النزول')}</p>`:`<div class="ph" style="width:100%;height:120px;font-size:12px;margin:10px 0">${tx('Photo coming soon','الصورة قريباً')}</div>`;
    return `<div class="sheet-bg" onclick="UI.sheet=null;render()"><div class="sheet" onclick="event.stopPropagation()">
      <button class="x" onclick="UI.sheet=null;render()">×</button>
      <h3 style="font-size:20px">${L(ex.n)}</h3>
      <div class="chips">${(ex.hl||[]).map(k=>`<span class="chip">${L(MUSCLE_NAME[k])}</span>`).join('')}</div>
      ${pics}
      <h2>${tx('Key point','نقطة مهمة')}</h2><p style="color:var(--text);font-size:15px">${L(ex.cue)}</p>
      <p class="muted" style="font-size:12px">${tx('Stop if you feel sharp pain. Mark it with the pain box on the workout screen.','توقف إذا شعرت بألم حاد. سجّله من خانة الألم في شاشة التمرين.')}</p>
    </div></div>`;
  }
  if(s.type==='finish'){
    const a=u.active,allDone=a.items.every(i=>i.status==='done'||i.status==='adjusted');
    return `<div class="sheet-bg" onclick="UI.sheet=null;render()"><div class="sheet" onclick="event.stopPropagation()">
      <button class="x" onclick="UI.sheet=null;render()">×</button>
      <h2 style="margin-top:0">${tx('Finish workout','إنهاء التمرين')}</h2>
      <h3>${tx('How did it go?','كيف كان التمرين؟')}</h3>
      <div class="grid2" style="margin-top:8px">
        <div class="opt ${(UI.f.res||(allDone?'all':'partly'))==='all'?'on':''}" onclick="save();UI.f.res='all';render()"><b>${tx('All done','أنجزت كله')}</b><small>${tx('Everything as planned or adjusted','كل شيء كما هو مخطط أو معدّل')}</small></div>
        <div class="opt ${(UI.f.res||(allDone?'all':'partly'))==='partly'?'on':''}" onclick="save();UI.f.res='partly';render()"><b>${tx('Partly','جزئياً')}</b><small>${tx('Some exercises were missed','بعض التمارين فاتت')}</small></div>
        <div class="opt ${UI.f.res==='none'?'on':''}" onclick="save();UI.f.res='none';render()"><b>${tx('Could not train','لم أتمكن من التدريب')}</b><small>${tx('Logged as a missed session','تسجل كجلسة فائتة')}</small></div>
      </div>
      <label>${tx('Notes (optional)','ملاحظات (اختياري)')}</label>
      <textarea rows="3" data-k="notes" placeholder="${tx('How did you feel? Anything to change?','كيف شعرت؟ هل هناك ما يحتاج تغييراً؟')}">${esc(UI.f.notes||'')}</textarea>
      <button class="btn" onclick="save();finishWorkout()">${tx('Save workout','حفظ التمرين')}</button>
    </div></div>`;
  }
  return '';
}

/* =====================================================================
   ROUTING + RENDER
   ===================================================================== */
const PUBLIC=['welcome','signup','verify','login'];
const APP=['home','program','progress','profile','workout','onboard','stop','parts'];
function route(){
  if(UI.screen==='legal') return;
  const u=me();
  if(!u){ if(!PUBLIC.includes(UI.screen)) UI.screen='welcome'; return; }
  if(!u.verified){ UI.screen='verify'; UI.pendingId=u.id; return; }
  if(u.profile.screen==='stop'&&UI.screen!=='stop'){ UI.screen='stop'; return; }
  if(!u.profile.setupDone){ if(UI.screen!=='onboard'&&UI.screen!=='stop') UI.screen='onboard'; return; }
  if(PUBLIC.includes(UI.screen)||UI.screen==='onboard'||UI.screen==='stop'){ if(UI.screen!=='stop') UI.screen='home'; }
  if(!APP.includes(UI.screen)) UI.screen='home';
}
function render(){
  route();
  const u=me();
  const showNav=u&&u.profile.setupDone&&!['onboard','stop','workout'].includes(UI.screen)&&APP.includes(UI.screen);
  const screenHTML=(SCREENS[UI.screen]||SCREENS.welcome)();
  document.getElementById('app').innerHTML=screenHTML+(showNav&&!String(screenHTML).includes('class="nav"')?navHTML():'')+sheetHTML();
}



/* ===================================================================== 
   AUTH (Supabase Auth): sign-up, email code, login, Google, session
   ===================================================================== */
function authErr(e){ return (e&&e.message)||tx('Something went wrong. Try again.','حدث خطأ. حاول مرة أخرى.'); }
function ensureLocal(au){
  const m=au.user_metadata||{};
  let u=DB.users.find(x=>x.id===au.id);
  if(!u){
    u={id:au.id,name:m.full_name||'',email:(au.email||'').toLowerCase(),phone:m.phone||'',
      country:m.country||'',emirate:m.emirate||null,verified:true,created:todayStr(),
      profile:{setupDone:false},weights:[],sessions:[],photos:[],active:null,
      consent:{terms:m.consent_terms||todayStr(),privacy:m.consent_privacy||todayStr(),health:m.consent_health||todayStr(),photos:null,marketing:m.consent_marketing||todayStr(),marketingOptOut:null}};
    DB.users.push(u);
  }
  u.verified=true; return u;
}
function afterSignIn(au){
  const u=ensureLocal(au); DB.sess=u.id; saveDB(); UI.f={}; UI.pendingEmail=null;
  go(u.profile.setupDone?'home':'onboard');
}
async function doSignup(){
  save(); const f=UI.f;
  if(!sb) return fail(tx('The service is not connected. Try again later.','الخدمة غير متصلة. حاول لاحقاً.'));
  if(!f.name||!f.name.trim()) return fail(tx('Enter your full name.','أدخل اسمك الكامل.'));
  if(!/^\S+@\S+\.\S+$/.test(f.email||'')) return fail(tx('Enter a valid email address.','أدخل بريداً إلكترونياً صحيحاً.'));
  if((f.phone||'').replace(/\D/g,'').length<8) return fail(tx('Enter a valid phone number.','أدخل رقم هاتف صحيحاً.'));
  if(!f.country) return fail(tx('Choose your country.','اختر الدولة.'));
  if(f.country==='AE'&&!f.emirate) return fail(tx('Choose your emirate.','اختر الإمارة.'));
  if((f.pw||'').length<8) return fail(tx('Password must be at least 8 characters.','يجب أن تكون كلمة المرور 8 أحرف على الأقل.'));
  if(f.pw!==f.pw2) return fail(tx('The two passwords do not match.','كلمتا المرور غير متطابقتين.'));
  if(!f.c1||!f.c2||!f.c3) return fail(tx('Please accept the terms, privacy policy and health disclaimer.','يرجى قبول الشروط وسياسة الخصوصية وإخلاء المسؤولية الصحي.'));
  const email=f.email.trim().toLowerCase();
  const {data,error}=await sb.auth.signUp({email,password:f.pw,options:{data:{
    full_name:f.name.trim(),phone:f.phone.trim(),country:f.country,emirate:f.country==='AE'?f.emirate:null,
    consent_terms:todayStr(),consent_privacy:todayStr(),consent_health:todayStr(),consent_marketing:todayStr()}}});
  if(error) return fail(authErr(error));
  if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0)
    return fail(tx('An account with this email already exists. Log in instead.','يوجد حساب بهذا البريد. سجّل الدخول بدلاً من ذلك.'));
  UI.pendingEmail=email; UI.f={}; UI.err=''; go('verify');
}
async function doVerify(){
  save(); const token=(UI.f.code||'').trim(); const email=UI.pendingEmail;
  if(!email) return go('welcome');
  if(!/^\d{6}$/.test(token)) return fail(tx('Enter the 6-digit code from your email.','أدخل الرمز المكون من 6 أرقام من بريدك.'));
  const {data,error}=await sb.auth.verifyOtp({email,token,type:'signup'});
  if(error||!data.user) return fail(tx('That code is not correct or has expired. Send a new code.','هذا الرمز غير صحيح أو منتهي. أرسل رمزاً جديداً.'));
  afterSignIn(data.user);
}
async function resendCode(){
  const email=UI.pendingEmail; if(!email||!sb) return;
  const {error}=await sb.auth.resend({type:'signup',email});
  if(error) return fail(authErr(error));
  UI.ok=tx('A new code was sent to your email.','تم إرسال رمز جديد إلى بريدك الإلكتروني.'); render();
}
async function doLogin(){
  save(); const f=UI.f; const email=(f.email||'').trim().toLowerCase();
  if(!sb) return fail(tx('The service is not connected. Try again later.','الخدمة غير متصلة. حاول لاحقاً.'));
  const {data,error}=await sb.auth.signInWithPassword({email,password:f.pw||''});
  if(error){
    if(/not confirmed/i.test(error.message||'')){
      UI.pendingEmail=email; UI.f={email}; await sb.auth.resend({type:'signup',email});
      UI.ok=tx('Verify your email first. A code was sent.','يجب تأكيد بريدك أولاً. تم إرسال رمز.'); return go('verify',true);
    }
    return fail(tx('Wrong email or password.','البريد الإلكتروني أو كلمة المرور غير صحيحة.'));
  }
  afterSignIn(data.user);
}
async function loginGoogle(){
  if(!sb) return fail(tx('The service is not connected. Try again later.','الخدمة غير متصلة. حاول لاحقاً.'));
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
  if(error) fail(authErr(error));
}
async function logout(){
  if(sb) await sb.auth.signOut();
  DB.sess=null; saveDB(); UI.f={}; UI.pendingEmail=null; go('welcome');
}
async function restoreSession(){
  if(!sb) return;
  const {data}=await sb.auth.getSession();
  if(data&&data.session&&data.session.user){
    const u=ensureLocal(data.session.user); DB.sess=u.id; saveDB();
    if(UI.screen==='welcome'||UI.screen==='login'||UI.screen==='signup') UI.screen=u.profile.setupDone?'home':'onboard';
    render();
  }
}

setInterval(updateTimers,1000);
render();
restoreSession();
</script>
