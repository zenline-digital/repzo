<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>REPZO admin</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--bg:#0b0b0c;--card:#141417;--card2:#1b1b20;--line:#2a2a30;--text:#f4f4f5;--muted:#9a9aa3;--red:#e5322d;--green:#3ddc84}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
header b{letter-spacing:6px;font-size:13px}
main{max-width:1100px;margin:0 auto;padding:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{background:var(--card);border:1px solid var(--line);color:var(--text);padding:9px 14px;border-radius:10px;cursor:pointer}
.tab.on{background:var(--red);border-color:var(--red);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card .n{font-size:26px;font-weight:800}
.card .l{color:var(--muted);font-size:12px;margin-top:4px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;background:var(--card2)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--card2)}
input,select{background:var(--card);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:10px;width:100%;max-width:340px}
button.act{background:var(--card2);border:1px solid var(--line);color:var(--muted);padding:9px 12px;border-radius:10px;cursor:not-allowed}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}
.muted{color:var(--muted)}
.err{background:#3a1212;border:1px solid #6b2222;color:#ffb4b0;padding:10px 12px;border-radius:10px;margin:10px 0}
.login{max-width:360px;margin:70px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.login h2{margin:0 0 14px}
.login label{display:block;margin:10px 0 6px;color:var(--muted);font-size:12px}
.btn{display:block;width:100%;margin-top:14px;background:var(--red);color:#fff;border:0;border-radius:10px;padding:12px;font-weight:700;cursor:pointer}
.pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line)}
.ok{color:var(--green)}
dl{display:grid;grid-template-columns:160px 1fr;gap:6px 12px;margin:0}
dt{color:var(--muted)}
dd{margin:0}
</style></head><body>
<header><b>REPZO ADMIN</b><button id="signout" class="tab" style="display:none" onclick="adminSignOut()">Sign out</button></header>
<main>
  <div id="login" class="login" style="display:none">
    <h2>Admin sign-in</h2>
    <button class="btn" style="background:#fff;color:#1f1f1f;border:1px solid #dadce0;display:flex;align-items:center;justify-content:center;gap:10px" onclick="adminGoogle()"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Continue with Google</button>
    <div class="muted" style="margin:12px 0 4px;text-align:center">or with your email and password</div>
    <label>Email</label><input id="em" type="email" autocomplete="username">
    <label>Password</label><input id="pw" type="password" autocomplete="current-password">
    <button class="btn" onclick="adminLogin()">Sign in</button>
    <div id="loginErr"></div>
  </div>

  <div id="app" style="display:none">
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </div>
  <div id="denied" class="panel" style="display:none"><b>Not authorised.</b><div class="muted">This account is not on the admin list.</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const SUPABASE_URL="https://rabzuknmzpsvsyxvghis.supabase.co";
const SUPABASE_KEY="sb_publishable_rusFDtWKie2C72tX2EYjdQ_5EL8_hui";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const TABS=[['dash','Dashboard'],['members','Members'],['activity','Activity'],['feedback','Feedback'],['promos','Promotions'],['audit','Audit log']];
let CUR='dash', DATA=null;
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?new Date(d).toLocaleString('en-GB',{timeZone:'Asia/Dubai',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const DAY=86400000;

async function adminLogin(){
  const email=document.getElementById('em').value.trim();
  const password=document.getElementById('pw').value;
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){ document.getElementById('loginErr').innerHTML='<div class="err">Wrong email or password.</div>'; return; }
  boot();
}
async function adminGoogle(){
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/admin'}});
  if(error){ document.getElementById('loginErr').innerHTML='<div class="err">'+esc(error.message)+'</div>'; }
}
async function adminSignOut(){ await sb.auth.signOut(); location.reload(); }

async function isAdmin(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user) return false;
  const {data,error}=await sb.from('admins').select('email').eq('email',user.email.toLowerCase());
  return !error && data && data.length===1;
}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ document.getElementById('login').style.display='block'; return; }
  document.getElementById('login').style.display='none';
  document.getElementById('signout').style.display='inline-block';
  if(!(await isAdmin())){ document.getElementById('denied').style.display='block'; return; }
  document.getElementById('app').style.display='block';
  await loadAll();
  renderTabs(); show(CUR);
}

async function loadAll(){
  const [members,logins,clicks,sessions,weights,consents,profiles,promos,audit]=await Promise.all([
    sb.from('members').select('*'),
    sb.from('member_logins').select('member_id,logged_at').order('logged_at',{ascending:false}).limit(5000),
    sb.from('promo_clicks').select('id,clicked_at,promo_title').order('clicked_at',{ascending:false}).limit(5000),
    sb.from('workout_sessions').select('member_id,session_date'),
    sb.from('weight_logs').select('member_id'),
    sb.from('consents').select('member_id,consent_type,granted,granted_at'),
    sb.from('training_profiles').select('*'),
    sb.from('promotions').select('*').order('sort_order'),
    sb.from('admin_audit_log').select('*').order('created_at',{ascending:false}).limit(500)
  ]);
  DATA={members:members.data||[],logins:logins.data||[],clicks:clicks.data||[],sessions:sessions.data||[],
        weights:weights.data||[],consents:consents.data||[],profiles:profiles.data||[],promos:promos.data||[],audit:audit.data||[]};
  const err=[members,logins,clicks,sessions,weights,consents,profiles,promos,audit].find(r=>r.error);
  const fb=await sb.from('feedback').select('*').order('created_at',{ascending:false}).limit(1000);
  DATA.feedback=fb.data||[];
  if(err) console.warn('Some data could not be loaded:',err.error.message);
}

function lastLogin(id){ const l=DATA.logins.find(x=>x.member_id===id); return l?l.logged_at:null; }

function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab ${k===CUR?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
}
function go(k){ CUR=k; renderTabs(); show(k); }
function show(k){
  const v=document.getElementById('view');
  if(k==='dash') v.innerHTML=dash();
  if(k==='members') v.innerHTML=members();
  if(k==='activity') v.innerHTML=activity();
  if(k==='promos') v.innerHTML=promos();
  if(k==='feedback') v.innerHTML=feedbackTab();
  if(k==='audit') v.innerHTML=audit();
}

function signupChart(){
  const days=30, now=new Date(); const counts=[];
  for(let k=days-1;k>=0;k--){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-k);
    const key=d.toISOString().slice(0,10);
    counts.push({key,n:DATA.members.filter(m=>String(m.created_at||'').slice(0,10)===key).length});
  }
  const max=Math.max(1,...counts.map(c=>c.n)); const w=100/days;
  const bars=counts.map((c,i)=>{ const h=Math.round((c.n/max)*120); return `<g><rect x="${i*w+0.6}%" y="${130-h}" width="${w-1.2}%" height="${h}" fill="${c.n?'#e5322d':'#2a2a30'}"><title>${c.key}: ${c.n}</title></rect></g>`; }).join('');
  return `<div class="panel"><h3 style="margin:0 0 8px">Sign-ups, last 30 days</h3>
    <svg viewBox="0 0 1000 140" preserveAspectRatio="none" style="width:100%;height:160px">${bars.replace(/(\d+(\.\d+)?)%/g,(m,v)=>(Number(v)*10)+'')}</svg>
    <div class="muted" style="font-size:12px">${counts.reduce((t,c)=>t+c.n,0)} sign-ups in this period. Hover a bar to see the day.</div></div>`;
}
function dash(){
  const now=Date.now();
  const active7=new Set(DATA.logins.filter(l=>now-new Date(l.logged_at)<7*DAY).map(l=>l.member_id)).size;
  const signups7=DATA.members.filter(m=>now-new Date(m.created_at)<7*DAY).length;
  const setupDone=DATA.profiles.filter(p=>p.setup_done).length;
  const clicks7=DATA.clicks.filter(c=>now-new Date(c.clicked_at)<7*DAY).length;
  const workouts=DATA.sessions.length;
  const cards=[
    ['Total members',DATA.members.length],
    ['Active members (last 7 days)',active7],
    ['Sign-ups (last 7 days)',signups7],
    ['Total logins',DATA.logins.length],
    ['THUGFIT link clicks (all time)',DATA.clicks.length],
    ['THUGFIT link clicks (last 7 days)',clicks7],
    ['Finished setup',setupDone],
    ['Workouts logged',workouts]
  ];
  return `<div class="cards">${cards.map(([l,n])=>`<div class="card"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`).join('')}</div>
  ${signupChart()}
  <div class="muted">Times are shown in UAE time. Counts update when you reload this page.</div>`;
}

function members(){
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
  <input id="q" placeholder="Search name, email, country" oninput="filterMembers()" style="max-width:340px">
  <button class="tab" onclick="exportCSV()">Download CSV</button>
  <button class="tab" onclick="exportXLSX()">Download Excel</button>
  <button class="tab" onclick="printMembers()">Print / PDF</button>
  <span class="muted">${DATA.members.length} members</span></div>
  <table><thead><tr><th>Name</th><th>Email</th><th>Country</th><th>Status</th><th>Joined</th><th>Last login</th></tr></thead>
  <tbody id="mrows">${memberRows(DATA.members)}</tbody></table>
  <div id="detail"></div>`;
}
function memberRows(list){
  return list.map(m=>`<tr class="click" onclick="detail('${esc(m.id)}')"><td>${esc(m.full_name)}</td><td>${esc(m.email)}</td><td>${esc(m.country)}</td><td><span class="pill">${esc(m.status)}</span></td><td>${fmt(m.created_at)}</td><td>${fmt(lastLogin(m.id))}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No members yet.</td></tr>';
}

/* ---------- Member export: every detail, one row per member ---------- */
const EXPORT_COLS=['Member ID','Full name','Email','Mobile','Date of birth','Age','Country','Region or emirate','Other country name',
  'Marketing accepted','Marketing date','Status','Joined','Last login','Total logins','Setup finished','Sex','Height (cm)','Weight (kg)',
  'Body type','Goal','Experience','Equipment','Days per week','Session minutes','Program start','Weight entries','Workouts logged',
  'Terms','Privacy','Health disclaimer','Marketing consent'];
function ageOf(d){ if(!d) return ''; const b=new Date(d+'T00:00:00'), n=new Date(); let a=n.getFullYear()-b.getFullYear(); const m=n.getMonth()-b.getMonth(); if(m<0||(m===0&&n.getDate()<b.getDate())) a--; return a; }
function exportRows(){
  return DATA.members.map(m=>{
    const p=DATA.profiles.find(x=>x.member_id===m.id)||{};
    const cs=DATA.consents.filter(x=>x.member_id===m.id);
    const cons=t=>{ const c=cs.filter(x=>x.consent_type===t).sort((a,b)=>new Date(b.granted_at)-new Date(a.granted_at))[0];
      return c?(c.granted?'Yes':'No')+' ('+String(c.granted_at).slice(0,10)+')':''; };
    return {
      'Member ID':m.id,'Full name':m.full_name||'','Email':m.email||'','Mobile':m.phone||'',
      'Date of birth':m.date_of_birth||'','Age':ageOf(m.date_of_birth),'Country':m.country||'',
      'Region or emirate':m.region||'','Other country name':m.country_other||'',
      'Marketing accepted':m.marketing_accepted?'Yes':'No','Marketing date':m.marketing_accepted_at?String(m.marketing_accepted_at).slice(0,10):'',
      'Status':m.status||'','Joined':m.created_at?String(m.created_at).slice(0,10):'',
      'Last login':lastLogin(m.id)?String(lastLogin(m.id)).slice(0,16).replace('T',' '):'',
      'Total logins':DATA.logins.filter(x=>x.member_id===m.id).length,
      'Setup finished':p.setup_done?'Yes':'No','Sex':p.sex||'','Height (cm)':p.height_cm||'','Weight (kg)':p.weight_kg||'',
      'Body type':p.body_type||'','Goal':p.goal||'','Experience':p.experience||'',
      'Equipment':Array.isArray(p.equipment)?p.equipment.join(', '):(p.equipment||''),
      'Days per week':p.days_per_week||'','Session minutes':p.session_minutes||'',
      'Program start':p.program_started_on||'',
      'Weight entries':DATA.weights.filter(x=>x.member_id===m.id).length,
      'Workouts logged':DATA.sessions.filter(x=>x.member_id===m.id).length,
      'Terms':cons('terms'),'Privacy':cons('privacy'),'Health disclaimer':cons('health'),'Marketing consent':cons('marketing')
    };
  });
}
function exportCSV(){
  const rows=exportRows();
  const esc2=v=>{ const t=String(v==null?'':v); return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; };
  const lines=[EXPORT_COLS.join(',')].concat(rows.map(r=>EXPORT_COLS.map(c=>esc2(r[c])).join(',')));
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='repzo-members-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
}
function exportXLSX(){
  if(typeof XLSX==='undefined'){ alert('The Excel library did not load. Check your internet connection and try again, or use CSV.'); return; }
  const rows=exportRows();
  const ws=XLSX.utils.json_to_sheet(rows,{header:EXPORT_COLS});
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Members');
  XLSX.writeFile(wb,'repzo-members-'+new Date().toISOString().slice(0,10)+'.xlsx');
}
function printMembers(){
  const rows=exportRows();
  const head='<tr>'+EXPORT_COLS.map(c=>'<th>'+c+'</th>').join('')+'</tr>';
  const body=rows.map(r=>'<tr>'+EXPORT_COLS.map(c=>'<td>'+String(r[c]==null?'':r[c]).replace(/</g,'&lt;')+'</td>').join('')+'</tr>').join('');
  const w=window.open('','_blank');
  w.document.write('<html><head><title>REPZO members</title><style>@page{size:landscape;margin:10mm}body{font-family:Arial,sans-serif;font-size:9px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:3px;vertical-align:top}th{background:#eee}h2{font-size:14px}</style></head><body>'
    +'<h2>REPZO members ('+rows.length+') · '+new Date().toLocaleString()+'</h2><table>'+head+body+'</table></body></html>');
  w.document.close(); w.focus(); setTimeout(()=>w.print(),300);
}
function filterMembers(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  const list=DATA.members.filter(m=>[m.full_name,m.email,m.country].some(x=>(x||'').toLowerCase().includes(q)));
  document.getElementById('mrows').innerHTML=memberRows(list);
}
function detail(id){
  const m=DATA.members.find(x=>x.id===id); if(!m) return;
  const p=DATA.profiles.find(x=>x.member_id===id)||{};
  const c=DATA.consents.filter(x=>x.member_id===id);
  const nW=DATA.weights.filter(x=>x.member_id===id).length;
  const nS=DATA.sessions.filter(x=>x.member_id===id).length;
  const nL=DATA.logins.filter(x=>x.member_id===id).length;
  const cons=c.length?c.map(x=>`${esc(x.consent_type)}: ${x.granted?'yes':'no'} (${fmt(x.granted_at)})`).join('<br>'):'—';
  document.getElementById('detail').innerHTML=`<div class="panel">
    <h3 style="margin:0 0 12px">${esc(m.full_name)||'(no name)'}</h3>
    <dl>
      <dt>Email</dt><dd>${esc(m.email)}</dd>
      <dt>Phone</dt><dd>${esc(m.phone)||'—'}</dd>
      <dt>Country / emirate</dt><dd>${esc(m.country)||'—'} ${esc(m.emirate)||''}</dd>
      <dt>Status</dt><dd>${esc(m.status)}</dd>
      <dt>Joined</dt><dd>${fmt(m.created_at)}</dd>
      <dt>Last login</dt><dd>${fmt(lastLogin(m.id))}</dd>
      <dt>Logins</dt><dd>${nL}</dd>
      <dt>Training profile</dt><dd>${p.setup_done?'Setup finished':'Not finished'}${p.goal?' · Goal: '+esc(p.goal):''}${p.experience?' · Experience: '+esc(p.experience):''}${p.days_per_week?' · Days/week: '+esc(p.days_per_week):''}</dd>
      <dt>Weight entries</dt><dd>${nW}</dd>
      <dt>Workouts logged</dt><dd>${nS}</dd>
      <dt>Consents</dt><dd>${cons}</dd>
    </dl>
    <h3 style="margin:18px 0 8px">Edit details</h3>
      <div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
        <div><label class="muted" style="font-size:12px">Full name</label><input id="ed_full_name" value="${esc(m.full_name||'')}"></div>
        <div><label class="muted" style="font-size:12px">Email</label><input id="ed_email" value="${esc(m.email||'')}"></div>
        <div><label class="muted" style="font-size:12px">Mobile</label><input id="ed_phone" value="${esc(m.phone||'')}"></div>
        <div><label class="muted" style="font-size:12px">Date of birth</label><input id="ed_date_of_birth" type="date" value="${esc(m.date_of_birth||'')}"></div>
        <div><label class="muted" style="font-size:12px">Country</label><input id="ed_country" value="${esc(m.country||'')}"></div>
        <div><label class="muted" style="font-size:12px">Region or emirate</label><input id="ed_region" value="${esc(m.region||'')}"></div>
        <div><label class="muted" style="font-size:12px">Other country name</label><input id="ed_country_other" value="${esc(m.country_other||'')}"></div>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="tab" onclick="saveMember('${esc(m.id)}')">Save changes</button>
        <button class="tab" onclick="adminAct('reset_password','${esc(m.id)}')">Send password reset email</button>
        <button class="tab" onclick="adminAct('${m.status==='suspended'?'reactivate':'suspend'}','${esc(m.id)}')">${m.status==='suspended'?'Reactivate account':'Suspend account'}</button>
        <button class="tab" style="border-color:#6b2222;color:#ffb4b0" onclick="deleteMember('${esc(m.id)}')">Delete member and all data</button>
      </div>
      <div class="muted" style="margin-top:8px;font-size:12px">Passwords are never shown. A reset sends an email to the member. Every action is recorded in the Audit log.</div>
  </div>`;
}

function activity(){
  const now=Date.now();
  const ll=id=>{const l=DATA.logins.find(x=>x.member_id===id);return l?new Date(l.logged_at).getTime():0;};
  const active=DATA.members.filter(m=>now-ll(m.id)<7*DAY && ll(m.id)>0);
  const lapsed=DATA.members.filter(m=>ll(m.id)>0 && now-ll(m.id)>=7*DAY);
  const never=DATA.members.filter(m=>ll(m.id)===0);
  const block=(t,list)=>`<h3 style="margin:18px 0 8px">${t} <span class="muted">(${list.length})</span></h3>`+
    `<table><thead><tr><th>Name</th><th>Email</th><th>Last login</th></tr></thead><tbody>${list.map(m=>`<tr><td>${esc(m.full_name)}</td><td>${esc(m.email)}</td><td>${fmt(lastLogin(m.id))}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">None</td></tr>'}</tbody></table>`;
  return `<div class="muted">Active = logged in during the last 7 days.</div>`+
    block('Active',active)+block('Not active (last login 7+ days ago)',lapsed)+block('Never logged in',never);
}


/* ---------- Member feedback ---------- */
const FB_CAT={suggestion:'Suggestion',problem:'Not working',feature:'New feature',other:'Other'};
function feedbackTab(){
  const who=id=>{ const m=DATA.members.find(x=>x.id===id); return m?(esc(m.full_name)+'<br><span class="muted">'+esc(m.email)+'</span>'):'<span class="muted">(deleted member)</span>'; };
  const rows=(DATA.feedback||[]).map(f=>`<tr><td>${fmt(f.created_at)}</td><td>${who(f.member_id)}</td><td>${esc(FB_CAT[f.category]||f.category)}</td><td style="max-width:420px;white-space:pre-wrap">${esc(f.message)}${(f.attachments&&f.attachments.length)?`<div style="margin-top:6px"><button class="tab" onclick="openFbFiles('${esc(f.id)}')">Open ${f.attachments.length} attachment(s)</button></div>`:''}${f.reply_text?'<div class="muted" style="margin-top:8px;border-top:1px solid var(--line);padding-top:6px">Reply sent '+fmt(f.replied_at)+':<br>'+esc(f.reply_text)+'</div>':`<div style="margin-top:8px"><textarea id="rp_${esc(f.id)}" rows="3" style="max-width:380px;width:100%" placeholder="Write your reply. It is emailed to the member."></textarea><br><button class="tab" onclick="sendReply('${esc(f.id)}')">Send reply by email</button></div>`}</td><td>
      <select onchange="setFbStatus('${esc(f.id)}',this.value)">
        ${['new','in_progress','done'].map(st=>`<option value="${st}" ${f.status===st?'selected':''}>${st==='new'?'New':st==='in_progress'?'In progress':'Done'}</option>`).join('')}
      </select></td></tr>`).join('');
  return `<div class="muted" style="margin-bottom:10px">${(DATA.feedback||[]).length} messages. Change the status when you have dealt with a message.</div>
  <table><thead><tr><th>When</th><th>Member</th><th>Type</th><th>Message</th><th>Status</th></tr></thead>
  <tbody>${rows||'<tr><td colspan="5" class="muted">No feedback yet.</td></tr>'}</tbody></table>`;
}

async function sendReply(id){
  const t=document.getElementById('rp_'+id); const text=t?t.value.trim():'';
  if(text.length<2){ alert('Write a reply first.'); return; }
  const {data,error}=await sb.functions.invoke('reply-feedback',{body:{id,reply:text}});
  if(error||(data&&data.error)){ alert('Not sent: '+((data&&data.error)||(error&&error.message))); return; }
  await loadAll(); show('feedback');
}

async function openFbFiles(id){
  const f=(DATA.feedback||[]).find(x=>x.id===id); if(!f) return;
  for(const att of (f.attachments||[])){
    const {data,error}=await sb.storage.from('feedback-attachments').createSignedUrl(att.path,600);
    if(error){ alert('Could not open '+att.name+': '+error.message); continue; }
    window.open(data.signedUrl,'_blank');
  }
}

/* ---------- Admin actions (run on the secure server) ---------- */
async function adminAct(action,id,data){
  const {data:res,error}=await sb.functions.invoke('admin-actions',{body:{action,member_id:id,data:data||{}}});
  if(error||(res&&res.error)){ alert('Not done: '+((res&&res.error)||(error&&error.message))); return false; }
  await loadAll();
  const done={reset_password:'Password reset email sent to the member.',suspend:'Account suspended.',reactivate:'Account reactivated.'};
  if(done[action]) alert(done[action]);
  return true;
}
async function saveMember(id){
  const g=x=>document.getElementById('ed_'+x).value.trim();
  const data={full_name:g('full_name'),email:g('email'),phone:g('phone'),date_of_birth:g('date_of_birth'),
    country:g('country'),region:g('region'),country_other:g('country_other')};
  if(await adminAct('edit',id,data)){ alert('Saved.'); show('members'); detail(id); }
}
async function deleteMember(id){
  const typed=prompt('This permanently deletes the member and all their data. Type DELETE to confirm.');
  if(typed!=='DELETE') return;
  if(await adminAct('delete',id,{confirm:'DELETE'})){ alert('Member deleted.'); show('members'); }
}

async function setFbStatus(id,status){
  const {error}=await sb.from('feedback').update({status}).eq('id',id);
  if(error){ alert('Could not update: '+error.message); return; }
  await loadAll(); show('feedback');
}

function promos(){
  const e=(window.PROMO_EDIT&&DATA.promos.find(p=>p.id===window.PROMO_EDIT))||{};
  const rows=DATA.promos.map(p=>`<tr><td>${esc(p.title_en)}</td><td>${esc(p.title_ar)}</td><td>${esc(p.url)}</td><td>${p.active?'<span class="ok">On</span>':'Off'}</td><td>${p.sort_order}</td>
    <td><button class="tab" onclick="promoEdit('${esc(p.id)}')">Edit</button> <button class="tab" onclick="promoToggle('${esc(p.id)}',${!p.active})">${p.active?'Turn off':'Turn on'}</button> <button class="tab" onclick="promoDelete('${esc(p.id)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No promotions yet.</td></tr>';
  return `<table><thead><tr><th>Title (EN)</th><th>Title (AR)</th><th>Link</th><th>Status</th><th>Order</th><th></th></tr></thead><tbody>${rows}</tbody></table>
  <h3 style="margin:18px 0 8px">${window.PROMO_EDIT?'Edit promotion':'Add promotion'}</h3>
  <div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
    <div><label class="muted" style="font-size:12px">Title (English)</label><input id="pr_title_en" value="${esc(e.title_en||'')}"></div>
    <div><label class="muted" style="font-size:12px">Title (Arabic)</label><input id="pr_title_ar" value="${esc(e.title_ar||'')}"></div>
    <div><label class="muted" style="font-size:12px">Text (English)</label><input id="pr_text_en" value="${esc(e.text_en||'')}"></div>
    <div><label class="muted" style="font-size:12px">Text (Arabic)</label><input id="pr_text_ar" value="${esc(e.text_ar||'')}"></div>
    <div><label class="muted" style="font-size:12px">Link (https://…)</label><input id="pr_url" value="${esc(e.url||'https://thugfit.ae')}"></div>
    <div><label class="muted" style="font-size:12px">Order (smallest first)</label><input id="pr_sort_order" type="number" value="${esc(e.sort_order??1)}"></div>
    <div><label class="muted" style="font-size:12px"><input id="pr_active" type="checkbox" ${(e.active??true)?'checked':''} style="width:auto"> Show in the app</label></div>
  </div>
  <div style="margin-top:12px;display:flex;gap:8px"><button class="tab" onclick="promoSave()">${window.PROMO_EDIT?'Save promotion':'Add promotion'}</button>${window.PROMO_EDIT?'<button class="tab" onclick="window.PROMO_EDIT=null;show(\'promos\')">Cancel</button>':''}</div>`;
}
function promoEdit(id){ window.PROMO_EDIT=id; show('promos'); }
async function promoSave(){
  const g=x=>document.getElementById('pr_'+x).value.trim();
  const data={id:window.PROMO_EDIT||null,title_en:g('title_en'),title_ar:g('title_ar'),text_en:g('text_en'),text_ar:g('text_ar'),
    url:g('url'),sort_order:g('sort_order'),active:document.getElementById('pr_active').checked};
  const {data:res,error}=await sb.functions.invoke('admin-actions',{body:{action:'promo_save',data}});
  if(error||(res&&res.error)){ alert('Not saved: '+((res&&res.error)||(error&&error.message))); return; }
  window.PROMO_EDIT=null; await loadAll(); show('promos');
}
async function promoToggle(id,on){
  const p=DATA.promos.find(x=>x.id===id); if(!p) return;
  const {data:res,error}=await sb.functions.invoke('admin-actions',{body:{action:'promo_save',data:{id,title_en:p.title_en,title_ar:p.title_ar,text_en:p.text_en,text_ar:p.text_ar,url:p.url,sort_order:p.sort_order,active:on}}});
  if(error||(res&&res.error)){ alert('Not changed: '+((res&&res.error)||(error&&error.message))); return; }
  await loadAll(); show('promos');
}
async function promoDelete(id){
  if(!confirm('Delete this promotion?')) return;
  const {data:res,error}=await sb.functions.invoke('admin-actions',{body:{action:'promo_delete',data:{id}}});
  if(error||(res&&res.error)){ alert('Not deleted: '+((res&&res.error)||(error&&error.message))); return; }
  await loadAll(); show('promos');
}

function audit(){
  const rows=DATA.audit.map(a=>`<tr><td>${fmt(a.created_at)}</td><td>${esc(a.admin_name)}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No admin actions recorded yet.</td></tr>';
  return `<table><thead><tr><th>When</th><th>Admin</th><th>Action</th><th>Detail</th></tr></thead><tbody>${rows}</tbody></table>`;
}

boot();
</script>
</body></html>
